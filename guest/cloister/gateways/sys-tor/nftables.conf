#!/usr/sbin/nft -f
# sys-tor firewall. eth0 = uplink (clnet), eth1 = clients (cltor).
# Fail closed: nothing from eth1 is ever forwarded; it can only talk to Tor itself.
flush ruleset

table inet cloister {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname "eth1" udp dport 53 redirect to :5353
    iifname "eth1" ip daddr != 10.152.152.1 tcp flags & (syn | ack) == syn redirect to :9040
  }

  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    iifname "eth1" udp dport { 67, 5353 } accept
    iifname "eth1" tcp dport { 9040, 9050 } accept
    iifname "eth1" icmp type echo-request accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
