#!/usr/sbin/nft -f
# sys-vpn firewall. eth0 = uplink (clnet), eth1 = clients (clvpn), wg0/tun0 = the tunnel.
# Kill switch: client traffic may only leave through the tunnel. If the tunnel is down,
# there is no interface it is allowed to use, so it is dropped.
flush ruleset

table inet cloister {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    iifname "eth1" udp dport { 53, 67 } accept
    iifname "eth1" tcp dport 53 accept
    iifname "eth1" icmp type echo-request accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    iifname "eth1" oifname { "wg0", "tun0" } accept
    iifname { "wg0", "tun0" } oifname "eth1" ct state established,related accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
    # DNS for clients must use the tunnel. Only sys-vpn's own lookups (e.g. the VPN
    # endpoint's hostname) may use the local resolver on the uplink.
    oifname "eth0" ip daddr != 10.150.150.1 meta l4proto { udp, tcp } th dport 53 drop
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname { "wg0", "tun0" } masquerade
  }
}
