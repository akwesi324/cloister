# DHCP for clvpn clients, and a DNS forwarder whose upstream is set by cloister-vpn-up
# to the VPN provider's resolver (reached through the tunnel). No upstream = no answers.
interface=eth1
bind-interfaces
no-resolv
servers-file=/etc/dnsmasq.d/vpn-upstream.servers
dhcp-range=10.153.153.10,10.153.153.250,255.255.255.0,12h
dhcp-option=option:router,10.153.153.1
dhcp-option=option:dns-server,10.153.153.1
dhcp-authoritative
